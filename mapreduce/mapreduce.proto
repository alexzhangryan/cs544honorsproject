syntax = "proto3";

package mapreduce;

// The boss is the only server. The client and the workers all call it.
service Boss {
  // Called by the client.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobReply);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusReply);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersReply);
  rpc CancelJob(CancelJobRequest) returns (CancelJobReply);

  // Called by workers.
  rpc GetTask(GetTaskRequest) returns (TaskAssignment);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc ReportTask(ReportTaskRequest) returns (ReportTaskReply);
}

enum TaskKind {
  NONE = 0;    // nothing to do right now; ask again shortly
  MAP = 1;
  REDUCE = 2;
}

// A byte range of one input file. The path is relative to the shared
// storage root.
message Chunk {
  string path = 1;
  int64 start = 2;
  int64 end = 3;
}

message SubmitJobRequest {
  string input_path = 1;    // file or directory, relative to the shared root
  string output_path = 2;   // directory, relative to the shared root
  string job_source = 3;    // source of the file defining map_fn and reduce_fn
  int32 num_map = 4;
  int32 num_reduce = 5;
  // "largest_first" (the default when empty): reduce tasks with the most
  // input are handed out first. "numerical": in order of task number.
  string reduce_order = 6;
  // Set to stop the boss from starting backup copies of slow tasks.
  bool no_backup_tasks = 7;
}

message SubmitJobReply {
  string job_id = 1;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusReply {
  string job_id = 1;
  string state = 2;             // RUNNING, SUCCEEDED, FAILED or CANCELLED
  int32 maps_done = 3;
  int32 maps_total = 4;
  int32 reduces_done = 5;
  int32 reduces_total = 6;
  string error = 7;             // set when state is FAILED
  double elapsed_seconds = 8;   // from submission to now, or to the end
  int32 requeues = 9;           // tasks re-queued after a worker failure
  string output_path = 10;
  int64 intermediate_bytes = 11;  // size of the map output; 0 until the map phase ends
  int32 backup_tasks = 12;        // backup copies started for slow tasks
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobReply {
  string state = 1;             // CANCELLED
  string output_path = 2;       // where any output written so far was left
}

message ListWorkersRequest {}

message WorkerInfo {
  string worker_id = 1;
  bool alive = 2;
  string current_task = 3;      // for example "map 3 of job-...", or empty
  double seconds_since_contact = 4;
}

message ListWorkersReply {
  repeated WorkerInfo workers = 1;
}

message GetTaskRequest {
  string worker_id = 1;
}

message TaskAssignment {
  TaskKind kind = 1;
  string job_id = 2;
  int32 task_id = 3;
  int32 attempt = 4;            // goes up each time the task is handed out
  int32 num_map = 5;
  int32 num_reduce = 6;
  repeated Chunk chunks = 7;    // map tasks only
  string output_path = 8;       // the job's output directory
  bool backup = 9;              // a second copy of a task that is running slowly elsewhere
}

message HeartbeatRequest {
  string worker_id = 1;
  // The task attempt the worker is running.
  string job_id = 2;
  TaskKind kind = 3;
  int32 task_id = 4;
  int32 attempt = 5;
}

message HeartbeatReply {
  // True if the worker should stop its task: another copy of the task has
  // finished, or the job has failed.
  bool cancel = 1;
}

message ReportTaskRequest {
  string worker_id = 1;
  string job_id = 2;
  TaskKind kind = 3;
  int32 task_id = 4;
  int32 attempt = 5;
  bool success = 6;
  string error = 7;             // traceback text when success is false
}

message ReportTaskReply {
  bool accepted = 1;            // false for a stale or unknown report
}
